name: Tessera plugin validation and store image

on:
  push:
    branches: [main]
    paths:
      - "tessera-plugin.yaml"
      - "plugin.yaml"
      - "preview.yaml"
      - "components/**"
      - "translations/**"
      - ".github/workflows/tessera-preview.yml"
  workflow_dispatch:

concurrency:
  group: tessera-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-preview-store:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out the official Tessera plugin tools
        uses: actions/checkout@v4
        with:
          repository: MaxGramser/tessera-plugins
          path: tessera-tools

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev git python3 python3-venv python3-pip python3-yaml python3-pil

      - name: Validate plugin manifest and source
        run: python3 tessera-tools/tools/check.py plugin

      - name: Prepare the official preview bench
        run: python3 tessera-tools/tools/preview.py --setup

      - name: Render every supported large display
        run: |
          python3 tessera-tools/tools/preview.py plugin \
            --board crowpanel101 \
            --board jc1060p470 \
            --board jc1060p470v2 \
            --board jc8012p4a1 \
            --board jc8012p4a1v2 \
            --board jc8012p4a1v3 \
            --board reterminald1001 \
            --board sunton8048s070 \
            --board waveshare101 \
            --board waveshare101v3 \
            --board waveshare7 \
            --board waveshare7b \
            --board wavesharep47 \
            --board wavesharep47b \
            --strict

      - name: Generate the official store image
        run: |
          python3 tessera-tools/tools/store_image.py plugin \
            --large jc8012p4a1v3 \
            --small jc8012p4a1v3 \
            --tiny jc8012p4a1v3

      - name: Commit the generated store image
        working-directory: plugin
        run: |
          if [ -f store.png ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add store.png
            if ! git diff --cached --quiet; then
              git commit -m "Generate Tessera plugin store image"
              git push
            fi
          else
            echo "store_image.py did not produce store.png" >&2
            exit 1
          fi

      - name: Upload preview report and store image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessera-preview
          path: |
            plugin/.preview/
            plugin/store.png
          if-no-files-found: warn
