# Home Assistant command responses used by the native Tessera bridge.
time_zone: Europe/Berlin

tiles:
  - tile: browser
    name: 01-Rezeptbrowser
    sizes: [full]

commands:
  "call_service:mealie_tessera_bridge.get_recipes":
    # The preview returns 24 sample recipes for every call; total=48 exposes page 2.
    total: 48
    total_pages: 12
    per_page: 4
    items:
      - { id: pasta-mit-tomatensauce, name: "Pasta mit Tomatensauce", seconds: 1800, servings: 4 }
      - { id: cremige-knoblauch-pasta, name: "Cremige Knoblauch-Pasta", seconds: 1500, servings: 2 }
      - { id: ofengemuese-mit-kraeutern, name: "Ofengemüse mit Kräutern", seconds: 2700, servings: 3 }
