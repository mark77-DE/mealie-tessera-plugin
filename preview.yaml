  "call_service:mealie_tessera_bridge.get_categories":
    items:
      - { id: hauptgerichte, name: "Hauptgerichte" }
      - { id: backen, name: "Backen" }
      - { id: suppen, name: "Suppen" }

  "call_service:mealie_tessera_bridge.get_recipe":
    time: 1800
    serv: 4
    i0: "400 g Spaghetti"
    i1: "1 Dose gehackte Tomaten"
    i2: "1 Zwiebel"
    i3: "2 Knoblauchzehen"
    i4: "2 EL Olivenöl"
    i5: "Salz und Pfeffer"
    s0: "Zwiebel und Knoblauch fein würfeln."
    s1: "Olivenöl erhitzen und Zwiebel sowie Knoblauch glasig dünsten."
    s2: "Tomaten hinzufügen und 15 Minuten köcheln lassen."
