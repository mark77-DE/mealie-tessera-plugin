      - { id: cremige-kuerbissuppe, name: "Cremige Kürbissuppe", seconds: 2100, servings: 6 }
      - { id: ofenkartoffeln-rosmarin, name: "Knusprige Ofenkartoffeln mit Rosmarin", seconds: 2400, servings: 2 }
      - { id: couscous-salat, name: "Bunter Couscous-Salat mit geröstetem Gemüse", seconds: 1800, servings: 4 }
      - { id: schokoladenkuchen, name: "Schokoladenkuchen mit flüssigem Kern", seconds: 1500, servings: 6 }
