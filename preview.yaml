      - { id: kuerbisrisotto, name: "Cremiges Kürbisrisotto", seconds: 2100, servings: 3 }
      - { id: pizza-margherita, name: "Pizza Margherita", seconds: 1800, servings: 2 }
      - { id: brokkoli-auflauf, name: "Brokkoli-Auflauf", seconds: 2400, servings: 4 }
