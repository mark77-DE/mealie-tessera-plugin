id: mealie_recipe_browser
version: 0.4.5
api: "0.28"
icon: chef-hat
maintainer: mark77-DE
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: [crowpanel101, jc1060p470, jc1060p470v2, jc8012p4a1, jc8012p4a1v2, jc8012p4a1v3, reterminald1001, sunton8048s070, waveshare101, waveshare101v3, waveshare7, waveshare7b, wavesharep47, wavesharep47b]
flash_kb: 12
permissions:
  ha_commands:
    - "call_service:mealie.get_recipes"
    - "call_service:mealie.get_recipe"
answers:
  - command: call_service:mealie.get_recipes
    fields:
      ids:   { path: "recipes.items[*].recipe_id", as: strings }
      names: { path: "recipes.items[*].name", as: strings }
      secs: { path: "recipes.items[*].total_time_seconds", as: numbers }
      serv: { path: "recipes.items[*].recipe_servings", as: numbers }
  - command: call_service:mealie.get_recipe
    fields:
      name: { path: "recipe.name" }
      time: { path: "recipe.total_time" }
      serv: { path: "recipe.recipe_servings", as: number }
      i0: { path: "recipe.ingredients[0].display" }
      i1: { path: "recipe.ingredients[1].display" }
      i2: { path: "recipe.ingredients[2].display" }
      i3: { path: "recipe.ingredients[3].display" }
      i4: { path: "recipe.ingredients[4].display" }
      i5: { path: "recipe.ingredients[5].display" }
      s0: { path: "recipe.instructions[0].text" }
      s1: { path: "recipe.instructions[1].text" }
      s2: { path: "recipe.instructions[2].text" }
inputs:
  - id: config_entry_id
    kind: text
    scope: all
    label: config_entry_id
    hint: config_entry_id_hint
tiles:
  - id: browser
    name: tile_browser
    icon: chef-hat
    sizes: { min: 3x2, max: 3x3, full: true }
    memory: 2600
    example: tile_example
cards:
  - { id: recipe, name: card_recipe }
