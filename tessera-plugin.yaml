id: mealie_recipe_browser
version: 0.5.3
api: "0.28"
icon: chef-hat
maintainer: mark77-DE
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: [jc8012p4a1, jc8012p4a1v2, jc8012p4a1v3, reterminald1001, waveshare101, waveshare101v3]
flash_kb: 12

permissions:
  ha_commands:
    - call_service:mealie_tessera_bridge.get_recipes
    - call_service:mealie_tessera_bridge.get_categories
    - call_service:mealie_tessera_bridge.get_recipe

tiles:
  - id: browser
    name: tile_browser
    icon: chef-hat
    sizes: { min: 3x2, max: 3x3, full: true }
    memory: 8000
    example: tile_example

cards:
  - { id: recipe, name: card_recipe }
