id: mealie_recipe_browser
version: 0.4.3
api: "0.28"
icon: chef-hat
maintainer: mark77-DE
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: [crowpanel101, jc1060p470, jc1060p470v2, jc8012p4a1, jc8012p4a1v2, jc8012p4a1v3, reterminald1001, sunton8048s070, waveshare101, waveshare101v3, waveshare7, waveshare7b, wavesharep47, wavesharep47b]
flash_kb: 12
permissions:
  ha_commands:
    - "call_service:mealie.get_recipes"
    - "call_service:mealie.get_recipe"
inputs:
  - id: config_entry_id
    kind: text
    scope: all
    label: config_entry_id
    hint: config_entry_id_hint
tiles:
  - id: browser
    name: tile_browser
    icon: chef-hat
    sizes: { full: true }
    memory: 2600
    example: tile_example
cards:
  - { id: recipe, name: card_recipe }
