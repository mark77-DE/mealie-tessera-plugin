id: mealie_recipe_browser
version: 0.4.6
api: "0.28"
icon: chef-hat
maintainer: mark77-DE
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: [crowpanel101, jc1060p470, jc1060p470v2, jc8012p4a1, jc8012p4a1v2, jc8012p4a1v3, reterminald1001, sunton8048s070, waveshare101, waveshare101v3, waveshare7, waveshare7b, wavesharep47, wavesharep47b]
flash_kb: 12

permissions:
  network: [luigi.mahlen.biz]
attributes: [cloud]
privacy: https://github.com/mark77-DE/mealie-tessera-plugin#privacy

inputs:
  - id: api_token
    kind: secret
    scope: all
    label: api_token
    hint: api_token_hint

tiles:
  - id: browser
    name: tile_browser
    icon: chef-hat
    sizes: { full: true }
    memory: 8000
    example: tile_example

cards:
  - { id: recipe, name: card_recipe }

fetch:
  - id: recipes
    asked: [page]
    url: https://luigi.mahlen.biz/api/recipes?page={page}&perPage=5&orderBy=name&orderDirection=asc
    headers: { Authorization: "Bearer {api_token}" }
    every: 30s
    map:
      items: "$.items[*]"
      fields:
        id: slug
        name: name
        seconds: { path: totalTimeSeconds, as: number }
        servings: { path: recipeServings, as: number }
      limit: 5
  - id: recipe
    asked: [slug]
    url: https://luigi.mahlen.biz/api/recipes/{slug}
    headers: { Authorization: "Bearer {api_token}" }
    every: 30s
    map:
      fields:
        name: name
        time: { path: totalTimeSeconds, as: number }
        serv: { path: recipeServings, as: number }
        i0: recipeIngredient[0].display
        i1: recipeIngredient[1].display
        i2: recipeIngredient[2].display
        i3: recipeIngredient[3].display
        i4: recipeIngredient[4].display
        i5: recipeIngredient[5].display
        s0: recipeInstructions[0].text
        s1: recipeInstructions[1].text
        s2: recipeInstructions[2].text
