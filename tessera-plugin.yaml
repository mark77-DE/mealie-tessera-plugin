id: mealie_recipe_browser
version: 0.4.2
api: "0.28"
icon: chef-hat
maintainer: mark77-DE
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: [jc8012p4a1v3]
flash_kb: 12
permissions:
  ha_commands:
    - "call_service:mealie.get_recipes"
    - "call_service:mealie.get_recipe"
inputs:
  - id: config_entry_id
    kind: text
    scope: all
    label: config_entry_id
    hint: config_entry_id_hint
tiles:
  - id: browser
    name: tile_browser
    icon: chef-hat
    sizes: { full: true }
    memory: 2600
    example: tile_example
    options:
      - { id: query, kind: text, default: sauce, label: query, hint: query_hint }
cards:
  - { id: recipe, name: card_recipe }
